services:
  app:
    image: growilabs/growi:8
    ports:
      - 3010:3000    # host:container — change host port if 3010 is taken too; use 127.0.0.1:3010:3000 to restrict to localhost only
    links:
      - mongo:mongo
      - elasticsearch:elasticsearch
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama running on the host (Linux needs this; Docker Desktop provides it natively)
    depends_on:
        mongo:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/growi?replicaSet=rs0
      - ELASTICSEARCH_URI=http://elasticsearch:9200/growi
      - ELASTICSEARCH_MAX_BODY_LENGTH_TO_INDEX=20000000
      - BULK_EXPORT_PDF_CONVERTER_URI=http://pdf-converter:3010
      - DRAWIO_URI=http://localhost:8081/?offline=1&https=0
      - PASSWORD_SEED=changeme   # CHANGE THIS before first boot, then leave it untouched
      - FILE_UPLOAD=local        # store attachments on local disk (fully on-premise, no S3/GCS)
      # - MATHJAX=1              # activate this line if you want to use MathJax
      # - PLANTUML_URI=http://   # activate this line and specify if you use your own PlantUML server rather than public plantuml.com
      # - FORCE_WIKI_MODE='public'    # activate this line to force wiki public mode
      # - FORCE_WIKI_MODE='private'   # activate this line to force wiki private mode
      # --- AI feature, backed by local Ollama (OpenAI-compatible endpoint) ---
      - AI_ENABLED=true
      - AI_PROVIDERS={"openai":{"enabled":true}}
      - AI_PROVIDER_API_KEYS={"openai":"ollama"}
      - AI_ALLOWED_MODELS=[{"provider":"openai","modelId":"gemma4:latest","isDefault":true,"providerOptions":{"openai":{"store":false}}}]
      # GROWI's "openai" provider has no built-in base-URL field; the AI SDK it uses
      # falls back to this plain env var when no explicit baseURL is set in code,
      # so this redirects "OpenAI" traffic to the local Ollama server instead.
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      # "store":false above is required: the AI SDK defaults to OpenAI's stateful
      # Responses API ("store":true), which replaces earlier conversation turns with
      # "item_reference" pointers that only OpenAI's own servers can resolve. Ollama's
      # /v1/responses is stateless and rejects those references ("unknown input item
      # type: item_reference"). Forcing store:false makes the SDK resend full message
      # content every turn instead, which Ollama can actually understand.
    restart: unless-stopped
    volumes:
      - growi_data:/data
      - page_bulk_export_tmp:/tmp/page-bulk-export

  mongo:
    image: mongo:8.2
    # For MongoDB 6.x
    # image: mongo:6.0
    # GROWI v8 requires a replica set because it uses MongoDB change streams,
    # which are unavailable on a standalone server. A single-node set is enough.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_configdb:/data/configdb
      - mongo_db:/data/db
    healthcheck:
      # Initiates the replica set on first boot (no-op afterwards), then reports
      # healthy only once this node has actually become PRIMARY — otherwise app
      # would start against a set that cannot accept writes yet.
      test: >
        mongosh --quiet --eval "
          try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }
          db.hello().isWritablePrimary || quit(1)
        "
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    # For Elasticsearch 8.x
    # image: docker.elastic.co/elasticsearch/elasticsearch:8.19.14
    environment:
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"  # increase amount if you have enough memory
      - LOG4J_FORMAT_MSG_NO_LOOKUPS=true # CVE-2021-44228 mitigation for Elasticsearch <= 6.8.20/7.16.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch/v9/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./elasticsearch/v9/config/elasticsearch-plugins.yml:/usr/share/elasticsearch/config/elasticsearch-plugins.yml
      # For Elasticsearch 8.x
      #- ./elasticsearch/v8/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      #- ./elasticsearch/v8/config/elasticsearch-plugins.yml:/usr/share/elasticsearch/config/elasticsearch-plugins.yml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 6

  pdf-converter:
    image: growilabs/pdf-converter:1
    restart: unless-stopped
    volumes:
      - page_bulk_export_tmp:/tmp/page-bulk-export

  drawio:
    image: jgraph/drawio:latest
    ports:
      - 8081:8080
    restart: unless-stopped

volumes:
  growi_data:
  mongo_configdb:
  mongo_db:
  es_data:
  page_bulk_export_tmp:
